name: Docker Build & Push

on:
  push:
    branches:
      - main
      - sprint-15-monitoring-deployment

jobs:
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - services/agent-service
          - services/etl-service
          - services/news-service
          - services/research-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          IMAGE=$(basename "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')

          docker build \
            -f ${{ matrix.service }}/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE}:latest \
            .

          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE}:latest